<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Payas Parab</title>
    <script>
      // Encode the current path into a redirect to / so the SPA can handle it.
      // Pattern from rafgraph/spa-github-pages.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
